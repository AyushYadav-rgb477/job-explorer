{% extends "base.html" %}
{% block title %}Log in · Job Explorer{% endblock %}
{% block content %}
<div class="card auth">
  <h1>Log in</h1>
  {% if accounts_enabled %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email <input type="email" name="email" autocomplete="email" required value="{{ request.form.email }}"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button class="btn">Log in</button>
  </form>
  <p class="muted small center">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
  {% else %}
  <p class="muted">Accounts are turned off because Supabase isn't configured on this server.</p>
  {% endif %}
</div>
{% endblock %}
